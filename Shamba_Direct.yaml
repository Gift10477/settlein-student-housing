  /api/ratings:
    get:
      tags: [Ratings]
      operationId: listRatings
      summary: List ratings. With farmerId, also returns an aggregate average and review count.
      parameters:
        - in: query
          name: farmerId
          schema: {type: integer}
        - in: query
          name: buyerId
          schema: {type: integer}
      responses:
        "200":
          description: >
            If farmerId is supplied, returns an object with `ratings`, `averageRating`,
            and `reviewCount`. If buyerId or neither filter is supplied, returns an array.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ratings:
                        type: array
                        items: {$ref: "#/components/schemas/Rating"}
                      averageRating:
                        oneOf:
                          - {type: string, example: "5.0"}
                          - {type: number, example: 0}
                        description: Rounded average as a decimal string, or numeric 0 when there are no ratings.
                      reviewCount: {type: integer}
                  - type: array
                    items: {$ref: '#/components/schemas/Rating'}
              examples:
                allRatings:
                  summary: All ratings currently in the development database
                  value:
                    - id: 1
                      farmer_id: 1
                      buyer_id: 8
                      order_id: 1
                      rating: 5
                      review_text: "excellent "
                      created_at: "2026-09-09T21:55:37.000Z"
                ratingsByFarmer:
                  summary: Filtered ratings response for farmer 1
                  value:
                    ratings:
                      - id: 1
                        farmer_id: 1
                        buyer_id: 8
                        order_id: 1
                        rating: 5
                        review_text: "excellent "
                        created_at: "2026-09-09T21:55:37.000Z"
                        farmer_name: "Maxwell Kimani"
                    averageRating: "5.0"
                    reviewCount: 1
        '500': {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Ratings]
      operationId: createRating
      summary: Submit a rating for a farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RatingInput'}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  id: {type: integer}
              example: {message: "Rating submitted successfully", id: 2}
        "400":
          description: Missing fields, or rating outside 1-5
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "rating must be between 1 and 5"}
        "404":
          description: Farmer or buyer does not exist with the required role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Farmer not found"}
        '500': {$ref: "#/components/responses/ServerError"}
