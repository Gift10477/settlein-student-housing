openapi: 3.0.3
info:
  title: Shamba Direct API
  description: |
    Shamba Direct is a REST API for a Kenyan farmer-to-buyer marketplace.

    ## Try it out
    1. Start MySQL and load `server/sql/schema.sql`.
    2. Copy `server/.env.example` to `server/.env` and configure the database.
    3. Start the API with `cd server && npm start`.
    4. Use **Try it out** below. The GET examples use records from the configured
       development database; IDs can differ if your database has changed.

    ## Data and write operations
    `/api/listings`, `/api/market-prices`, `/api/farmers/ratings`, and
    `/api/headquarters` provide the partner-facing read endpoints. Other
    endpoints support the web app and include operations that create, change,
    or delete database records. Changes made with **Try it out** are permanent.
    Use a local or disposable database when testing write operations.

    ## Authentication and privacy
    The API does not currently require or issue authentication tokens. Login
    checks credentials but does not create a session. Do not use real passwords
    or personal information in Swagger UI examples. Do not expose this
    development API to the public internet.

    ## Conventions
    Request bodies use JSON. Most write fields use camelCase; `/api/enquiries`
    currently accepts `product_id` and `buyer_id`. Response fields generally
    use snake_case. Monetary and quantity values may be JSON numbers or decimal
    strings depending on the endpoint. Timestamps use ISO 8601.

    Errors are JSON objects such as `{"error":"Listing not found"}`.
  version: "1.0.0"
servers:
  - url: http://localhost:5000
    description: Local development server (npm start in /server)
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable reason the request failed
      required: [error]
      example: {error: "Listing not found"}

    Product:
      type: object
      properties:
        id: {type: integer}
        farmer_id: {type: integer}
        name: {type: string}
        category: {type: string, nullable: true}
        price_per_kg: {type: string, description: "Decimal, serialized as a string"}
        quantity_kg: {type: string, description: "Decimal, serialized as a string"}
        county: {type: string, nullable: true}
        harvest_note: {type: string, nullable: true}
        image_emoji: {type: string, nullable: true}
        status: {type: string, enum: [pending_review, active, sold_out]}
        views: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        farmer_name: {type: string}
        farmer_verified: {type: integer, enum: [0, 1]}
      required: [id, farmer_id, name, price_per_kg, quantity_kg]
      example:
        id: 10
        farmer_id: 3
        name: "Grade A Maize"
        category: "Cereals & Grains"
        price_per_kg: "32.00"
        quantity_kg: "3500.00"
        county: "Uasin Gishu"
        harvest_note: "Post-harvest dry"
        image_emoji: "🌽"
        status: "active"
        views: 22
        created_at: "2026-09-09T16:02:57.000Z"
        updated_at: "2026-09-09T16:02:57.000Z"
        farmer_name: "James Mwangi"
        farmer_verified: 1

    ProductInput:
      type: object
      properties:
        farmerId: {type: integer}
        name: {type: string}
        category: {type: string}
        pricePerKg: {type: number}
        quantityKg: {type: number}
        county: {type: string}
        harvestNote: {type: string}
        imageEmoji: {type: string}
        status: {type: string, enum: [pending_review, active, sold_out], description: Defaults to pending_review.}
      required: [farmerId, name, pricePerKg, quantityKg]
      example:
        farmerId: 3
        name: "Kale (Swagger test)"
        category: "Vegetables"
        pricePerKg: 30
        quantityKg: 200
        county: "Uasin Gishu"
        harvestNote: "Picked this morning"

    ProductPatchInput:
      description: >
        Used for PUT /api/products/{id}. Unlike ProductInput (used for POST),
        every field here is optional — an update only changes the fields you
        send; anything omitted is left as-is. This is a separate schema from
        ProductInput specifically so a consumer reading the contract doesn't
        assume PUT requires the same fields POST does.
      type: object
      properties:
        name: {type: string}
        category: {type: string}
        pricePerKg: {type: number}
        quantityKg: {type: number}
        county: {type: string}
        harvestNote: {type: string}
        status: {type: string, enum: [pending_review, active, sold_out]}
      example: {pricePerKg: 50}

    Order:
      type: object
      properties:
        id: {type: integer}
        product_id: {type: integer}
        buyer_id: {type: integer}
        farmer_id: {type: integer}
        quantity_kg: {type: string}
        total_price: {type: string}
        status: {type: string, enum: [pending, confirmed, delivered, cancelled]}
        created_at: {type: string, format: date-time}
        product_name: {type: string}
        buyer_name: {type: string}
        buyer_phone: {type: string, description: "Sensitive buyer contact data; example value is redacted."}
        buyer_county: {type: string, nullable: true, description: "Sensitive buyer data; example value is redacted."}
        farmer_name: {type: string}
        buyer_company_name: {type: "string", nullable: true}
        buyer_delivery_address: {type: "string", nullable: true}
        updated_at: {type: "string", format: "date-time"}
      required: [id, product_id, buyer_id, farmer_id, status]
      example:
        id: 1
        product_id: 9
        buyer_id: 8
        farmer_id: 1
        quantity_kg: "500.00"
        total_price: "22500.00"
        status: "delivered"
        created_at: "2026-09-09T21:42:16.000Z"
        updated_at: "2026-09-09T21:55:23.000Z"
        product_name: "Roma Tomatoes"
        buyer_name: "REDACTED"
        buyer_phone: "REDACTED"
        buyer_county: "REDACTED"
        buyer_company_name: "REDACTED"
        buyer_delivery_address: "REDACTED"
        farmer_name: "REDACTED"

    OrderInput:
      type: object
      properties:
        productId: {type: integer}
        buyerId: {type: integer}
        quantityKg: {type: number, description: "Must be greater than 0", minimum: 0, exclusiveMinimum: true}
      required: [productId, buyerId, quantityKg]
      example: {productId: 9, buyerId: 8, quantityKg: 1}

    OrderStatusInput:
      type: object
      properties:
        status: {type: string, enum: [pending, confirmed, delivered, cancelled]}
      required: [status]
      example: {status: "confirmed"}

    Rating:
      type: object
      properties:
        id: {type: integer}
        farmer_id: {type: integer}
        buyer_id: {type: integer}
        order_id: {type: integer, nullable: true}
        rating: {type: integer, minimum: 1, maximum: 5}
        review_text: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        farmer_name: {type: string, description: "Included when filtering ratings by farmerId."}
      required: [id, farmer_id, buyer_id, rating]
      example:
        id: 1
        farmer_id: 1
        buyer_id: 8
        order_id: 1
        rating: 5
        review_text: "excellent "
        created_at: "2026-09-09T21:55:37.000Z"

    RatingInput:
      type: object
      properties:
        farmerId: {type: integer}
        buyerId: {type: integer}
        orderId: {type: integer, description: "Optional delivered order belonging to the specified farmer and buyer"}
        rating: {type: integer, minimum: 1, maximum: 5}
        reviewText: {type: string, maxLength: 500}
      required: [farmerId, buyerId, rating]
      example:
        farmerId: 3
        buyerId: 8
        rating: 5
        reviewText: "Fresh produce, thank you."

    ListingSummary:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        price_per_kg: {type: number}
        quantity_kg: {type: number}
        category: {type: string, nullable: true}
        county: {type: string, nullable: true}
      required: [id, name, price_per_kg, quantity_kg]

    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/ListingSummary'
        - type: object
          properties:
            farmer_id: {type: integer}
            farmer_name: {type: string}
            farmer_verified: {type: boolean}
            views: {type: integer}
          required: [farmer_id, farmer_name, farmer_verified, views]

    FarmerRating:
      type: object
      properties:
        farmer_id: {type: integer}
        farmer_name: {type: string}
        rating: {type: number, minimum: 0, maximum: 5}
      required: [farmer_id, farmer_name, rating]

    Enquiry:
      type: object
      properties:
        id: {type: integer}
        product_id: {type: integer}
        buyer_id: {type: integer, nullable: true}
        farmer_id: {type: integer}
        message: {type: string}
        created_at: {type: string, format: date-time}
        product_name: {type: string}
        buyer_name: {type: string, nullable: true}
      required: [id, product_id, farmer_id, message]
      example:
        id: 1
        product_id: 9
        buyer_id: 1
        farmer_id: 1
        message: "Can you deliver to Nairobi?"
        created_at: "2026-09-09T16:04:11.000Z"
        product_name: "Roma Tomatoes"
        buyer_name: "Maxwell Kimani"

    EnquiryInput:
      type: object
      properties:
        product_id: {type: integer}
        buyer_id: {type: integer}
        message: {type: string}
      required: [product_id, buyer_id, message]
      example: {product_id: 9, buyer_id: 8, message: "Can you deliver to Nairobi?"}

    ContactMessage:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        contact_info: {type: string}
        subject: {type: string, nullable: true}
        message: {type: string}
        created_at: {type: string, format: date-time}
      required: [id, name, contact_info, message]
      example:
        id: 1
        name: "Wanjiru"
        contact_info: "wanjiru@example.com"
        subject: "Partnership"
        message: "Hello, we would like to buy maize."
        created_at: "2026-10-13T18:34:30.000Z"

    ContactMessageInput:
      type: object
      properties:
        name: {type: string}
        contactInfo: {type: string}
        subject: {type: string}
        message: {type: string}
      required: [name, contactInfo, message]
      example:
        name: "Wanjiru"
        contactInfo: "wanjiru@example.com"
        subject: "Partnership"
        message: "Hello, we would like to buy maize."

    Headquarters:
      type: object
      properties:
        id: {type: integer}
        region_name: {type: string}
        county: {type: string}
        address: {type: string, nullable: true}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
      required: [id, region_name, county]
      example:
        id: 1
        region_name: "Shamba Direct HQ"
        county: "Nairobi"
        address: "2nd Floor, Ngong Road Plaza, Ngong Road, Nairobi"
        latitude: null
        longitude: null

    HeadquartersInput:
      type: object
      properties:
        regionName: {type: string}
        county: {type: string}
        address: {type: string}
        latitude: {type: number}
        longitude: {type: number}
      required: [regionName, county]
      example:
        regionName: "Western Hub"
        county: "Kakamega"
        address: "Mumias Road"
        latitude: 0.2827
        longitude: 34.7519

    HeadquartersPatchInput:
      type: object
      properties:
        regionName: {type: string}
        county: {type: string}
        address: {type: string}
        latitude: {type: number}
        longitude: {type: number}
      example:
        address: "Ngong Road, Nairobi"

    MarketPrice:
      type: object
      properties:
        crop_name: {type: string}
        price_per_kg: {type: number}
        county: {type: string, nullable: true}
      required: [crop_name, price_per_kg]
      example:
        crop_name: "Maize"
        price_per_kg: 32
        county: "Uasin Gishu"

    User:
      type: object
      properties:
        id: {type: integer}
        full_name: {type: string}
        email: {type: string, nullable: true}
        phone_number: {type: string}
        role: {type: string, enum: [farmer, buyer, admin]}
        county: {type: string, nullable: true}
        is_verified: {type: integer}
        created_at: {type: "string", format: "date-time"}
        updated_at: {type: "string", format: "date-time"}
        profile:
          type: "object"
          nullable: true
          description: "Farmers: { farm_size, main_crops }. Buyers: { company_name, business_type, delivery_address }."
          additionalProperties: true
      required: [id, full_name, phone_number, role]
      example:
        id: 5
        full_name: "Nairobi Provisions Ltd"
        email:
        phone_number: "REDACTED"
        role: "buyer"
        county: "Nairobi"
        is_verified: 1
        created_at: "2026-09-09T15:57:44.000Z"
        updated_at: "2026-09-09T15:57:44.000Z"
        profile:
          company_name: "Nairobi Provisions Ltd"
          business_type:
          delivery_address: "REDACTED"

    RegisterInput:
      description: Use a new, unique phone number for each registration test.
      type: object
      properties:
        role: {type: string, enum: [farmer, buyer]}
        fullName: {type: string}
        email: {type: string}
        phoneNumber: {type: string}
        password: {type: string}
        county: {type: string}
        farmSize: {type: string}
        nationalId: {type: string}
        mainCrops: {type: string}
        companyName: {type: string}
        kraPin: {type: string}
        businessType: {type: string}
        productsNeeded: {type: string}
        deliveryAddress: {type: string}
      required: [role, fullName, phoneNumber, password]
      example:
        role: "buyer"
        fullName: "Test Buyer"
        phoneNumber: "0700000000"
        password: "replace-with-a-new-test-password"
        county: "Nairobi"
        companyName: "Test Foods Ltd"

    LoginInput:
      description: Replace the sample values with credentials for an account you registered.
      type: object
      properties:
        phoneNumber: {type: string}
        password: {type: string}
      required: [phoneNumber, password]
      example: {phoneNumber: "0700000000", password: "replace-with-account-password"}
    MessageResponse:
      type: "object"
      properties:
        message: {type: "string"}
      required:
        - "message"
  responses:
    ServerError:
      description: "Unexpected server or database failure (e.g. a foreign key that does not exist, or an invalid enum value).
        The message names the operation that failed."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example: {error: "Failed to add listing"}

paths:
  /:
    get:
      tags: [System]
      operationId: healthCheck
      summary: "Health check"
      description: "Plain-text liveness check. Does not touch the database."
      responses:
        '200':
          description: "The API process is up"
          content:
            text/plain:
              schema: {type: "string"}
              example: "Shamba Direct API is running..."
  /api/test-db:
    get:
      tags: [System]
      operationId: databaseCheck
      summary: "Database connectivity check"
      description: "Runs `SELECT 1 + 1` against MySQL. Use it to confirm your `.env` credentials work."
      responses:
        '200':
          description: "Database reachable"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message: {type: "string"}
                  data:
                    type: "array"
                    items: {type: "object"}
              example:
                message: "Database connected successfully!"
                data:
                  - {result: 2}
        '500':
          description: "Database unreachable (wrong credentials, MySQL not running, schema not imported)"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error: {type: "string"}
                  details: {type: "string"}
              example:
                error: "Database connection failed"
                details: "Check the local database server and configured connection settings."
  /api/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List all products, including inactive listings
      parameters:
        - in: query
          name: county
          schema: {type: string}
        - in: query
          name: category
          schema: {type: string}
        - in: query
          name: farmerId
          schema: {type: integer}
        - in: query
          name: status
          schema: {type: string, enum: [active, pending_review, sold_out]}
        - in: query
          name: minQuantity
          schema: {type: number}
      responses:
        "200":
          description: Array of products (empty array if none match)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Product'}
              examples:
                databaseProducts:
                  summary: Current products from the development database
                  value:
                    - id: 9
                      farmer_id: 1
                      name: "Roma Tomatoes"
                      category: "Vegetables"
                      price_per_kg: "45.00"
                      quantity_kg: "5000.00"
                      county: "Kirinyaga"
                      harvest_note: "Harvested 2 days ago"
                      image_emoji: "🍅"
                      status: "active"
                      views: 67
                      created_at: "2026-09-09T16:02:57.000Z"
                      updated_at: "2026-10-14T06:30:54.000Z"
                      farmer_name: "Maxwell Kimani"
                      farmer_verified: 0
                    - id: 10
                      farmer_id: 3
                      name: "Grade A Maize"
                      category: "Cereals & Grains"
                      price_per_kg: "32.00"
                      quantity_kg: "3500.00"
                      county: "Uasin Gishu"
                      harvest_note: "Post-harvest dry"
                      image_emoji: "🌽"
                      status: "active"
                      views: 22
                      created_at: "2026-09-09T16:02:57.000Z"
                      updated_at: "2026-09-09T16:02:57.000Z"
                      farmer_name: "James Mwangi"
                      farmer_verified: 1
        '500': {$ref: "#/components/responses/ServerError"}
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a listing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
            example:
              farmerId: 3
              name: "Kale (Swagger test)"
              category: "Vegetables"
              pricePerKg: 30
              quantityKg: 200
              county: "Uasin Gishu"
              harvestNote: "Picked this morning"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  id: {type: integer}
              example: {message: "Listing created successfully", id: 11}
        "400":
          description: Missing fields or invalid numeric values / status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "farmerId, name, pricePerKg and quantityKg are required"}
        "404":
          description: Farmer does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Farmer not found"}
        '500': {$ref: "#/components/responses/ServerError"}
  /api/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product in any listing status (increments its view count)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
          description: Numeric id of the record (the `id` returned when it was created)
          example: 10
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
              example:
                id: 10
                farmer_id: 3
                name: "Grade A Maize"
                category: "Cereals & Grains"
                price_per_kg: "32.00"
                quantity_kg: "3500.00"
                county: "Uasin Gishu"
                harvest_note: "Post-harvest dry"
                image_emoji: "🌽"
                status: "active"
                views: 23
                created_at: "2026-09-09T16:02:57.000Z"
                updated_at: "2026-09-09T16:02:57.000Z"
                farmer_name: "James Mwangi"
                farmer_verified: 1
        "404":
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Listing not found"}
        "400":
          description: Product id is not an integer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "listing_id must be an integer"}
        '500': {$ref: "#/components/responses/ServerError"}
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update a listing (any subset of fields; unset fields are left unchanged)
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
          description: Numeric id of the record (the `id` returned when it was created)
          example: 10
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductPatchInput'}
        required: false
      responses:
        "200":
          description: "Updated"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageResponse"}
              example: {message: "Listing updated successfully"}
        "400":
          description: Invalid path id, numeric value or listing status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Listing not found"}
        '500': {$ref: "#/components/responses/ServerError"}
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a listing
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
          description: Numeric id of the record (the `id` returned when it was created)
          example: 10
      responses:
        "200":
          description: "Deleted"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageResponse"}
              example: {message: "Listing deleted successfully"}
        "404":
          description: Not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Listing not found"}
        '500': {$ref: "#/components/responses/ServerError"}
  /api/listings:
    get:
      tags: [Listings]
      operationId: listActiveListings
      summary: List active produce listings for the partner API
      parameters:
        - in: query
          name: county
          schema: {type: string}
        - in: query
          name: category
          schema: {type: string}
        - in: query
          name: farmerId
          schema: {type: integer}
        - in: query
          name: minQuantity
          schema: {type: number}
      responses:
        "200":
          description: Active listings only; an empty array is returned when no records match.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ListingSummary'}
              examples:
                databaseListings:
                  summary: Active listings from the development database
                  value:
                    - id: 9
                      name: "Roma Tomatoes"
                      price_per_kg: 45
                      quantity_kg: 5000
                      category: "Vegetables"
                      county: "Kirinyaga"
                    - id: 10
                      name: "Grade A Maize"
                      price_per_kg: 32
                      quantity_kg: 3500
                      category: "Cereals & Grains"
                      county: "Uasin Gishu"
        '500': {$ref: "#/components/responses/ServerError"}
  /api/listings/{listing_id}:
    get:
      tags: [Listings]
      operationId: getActiveListing
      summary: Get one active listing and increment its view count
      parameters:
        - in: path
          name: listing_id
          required: true
          schema: {type: integer}
          example: 10
      responses:
        "200":
          description: Active listing with farmer details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingDetail'}
              example:
                id: 10
                farmer_id: 3
                farmer_name: "James Mwangi"
                farmer_verified: true
                name: "Grade A Maize"
                category: "Cereals & Grains"
                price_per_kg: 32
                quantity_kg: 3500
                views: 23
                county: "Uasin Gishu"
        "400":
